generic-service:
  nameOverride: hmpps-activities-management-orchestrator-api
  productId: "DPS028" # productId for the product that this belongs too, i.e. DPS001, see README.md for details

  replicaCount: 4

  image:
    repository: ghcr.io/ministryofjustice/hmpps-activities-management-orchestrator-api
    tag: app_version # override at deployment time
    port: 8080

  ingress:
    enabled: true
    host: app-hostname.local # override per environment
    tlsSecretName: activities-orchestrator-api-cert
    modsecurity_enabled: true
    modsecurity_snippet: |
      # Evaluate and log rule matches but never block requests
      SecRuleEngine DetectionOnly
      # Tag every logged match so it can be filtered by team/namespace in the modsec logs
      SecDefaultAction "phase:2,pass,log,tag:github_team=activities-and-appointments,tag:namespace={{ .Release.Namespace }}"
      # Each suspicious match adds points to the request score; 949110 (request) and 959100 (response) block once the total passes a threshold.
      # Blocked requests get a 406 rather than the default 403; no effect until SecRuleEngine is On
      SecRuleUpdateActionById 949110 "t:none,deny,status:406,logdata:%{SERVER_NAME}"
      SecRuleUpdateActionById 959100 "t:none,deny,status:406,logdata:%{SERVER_NAME}"
      # Bearer JWTs are base64url, which can contain -- and trip the SQL comment-sequence rule
      SecRuleUpdateTargetById 942100 "!REQUEST_HEADERS:Authorization"
      SecRuleUpdateTargetById 942440 "!REQUEST_HEADERS:Authorization"
      # CRS paranoia level 2: enables stricter rules than the default level 1, so expect more false positives
      SecAction \
        "id:900000,\
         phase:1,\
         nolog,\
         pass,\
         t:none,\
         setvar:tx.paranoia_level=2"

  # Environment variables to load into the deployment
  env:
    SERVER_PORT: "8080"
    APPLICATIONINSIGHTS_CONFIGURATION_FILE: applicationinsights.json
    APPLICATIONINSIGHTS_STATSBEAT_DISABLED: "true"
    JAVA_TOOL_OPTIONS: "$(JAVA_PROXY_TOOL_OPTIONS) -XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=50.0"

  namespace_secrets:
    hmpps-activities-management-orchestrator-api-application-insights:
      APPLICATIONINSIGHTS_CONNECTION_STRING: "APPLICATIONINSIGHTS_CONNECTION_STRING"
    hmpps-activities-management-orchestrator-api-client-creds:
      SYSTEM_CLIENT_ID: "SYSTEM_CLIENT_ID"
      SYSTEM_CLIENT_SECRET: "SYSTEM_CLIENT_SECRET"
    hmpps-envoy-https-proxy-env:
      HTTP_PROXY: "HTTP_PROXY"
      HTTPS_PROXY: "HTTPS_PROXY"
      NO_PROXY: "NO_PROXY"
      JAVA_PROXY_TOOL_OPTIONS: "JAVA_PROXY_TOOL_OPTIONS"

  allowlist:
    groups:
      - internal

generic-prometheus-alerts:
  targetApplication: hmpps-activities-management-orchestrator-api
